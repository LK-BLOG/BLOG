<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 小戡的博客</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="description" content="小戡的博客 - 登录 / 注册 / 邮箱验证">
  <script src="js/account-theme.js"></script>
  <link rel="stylesheet" href="css/style.css?v=retro-account">
  <style>
    .login-switch { text-align:center; margin-top:12px; font-size:13px; }
    .login-switch a { color:#0000ff; cursor:pointer; }
    .gh-btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; box-sizing:border-box; text-decoration:none; font-weight:bold; }
    .gh-mark { flex:0 0 auto; }
    .login-divider { display:flex; align-items:center; gap:8px; color:#666; font-size:12px; margin:2px 0 12px; }
    .login-divider::before, .login-divider::after { content:""; flex:1; border-top:1px solid #808080; }
    .gh-note { text-align:center; margin:0 0 12px; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-brand"><a href="index.html" data-retro-home><span class="brand-icon">戡</span>小戡的博客 | 账号</a></div>
    <div class="nav-links login-home-link"><a href="index.html" data-retro-home>返回首页</a></div>
  </nav>

  <main>
    <section class="section" style="max-width:420px">
      <div class="win" style="margin:40px auto">
        <div class="win-title"><span class="win-label"><img class="win98-svg-icon" src="assets/win98-icons/user.png" alt=""> 登录 / 注册</span><span class="win-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>
        <div class="win-body">
          <div id="login-alert"></div>

          <a class="btn gh-btn" id="github-login" href="#">
            <svg class="gh-mark" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
            用 GitHub 登录
          </a>
          <p class="hint gh-note">邮箱用 GitHub 匿名邮箱（数字+用户名@users.noreply.github.com），不读取真实邮箱。</p>
          <div class="login-divider"><span>或用账号密码</span></div>

          <form id="login-form">
            <div class="form-row">
              <label for="username">用户名</label>
              <input class="field" type="text" id="username" maxlength="20" autocomplete="username" required>
              <p class="hint">注册新账号请切换到下面的“注册”。管理员请用用户名 admin 登录。</p>
            </div>
            <div class="form-row">
              <label for="password">密码</label>
              <input class="field" type="password" id="password" maxlength="72" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn primary" style="width:100%">登录</button>
          </form>

          <div class="login-switch">没有账号？<a id="goto-register">注册一个</a> | <a id="forgot-pw">忘记密码？</a></div>

          <form id="forgot-form" class="hidden" style="margin-top:12px;padding:10px;border:2px inset;border-color:#808080 #fff #fff #808080;background:#fff">
            <p class="muted mb8">邮箱验证重置密码。只有已绑定邮箱的账号会收到验证码。</p>
            <div class="form-row">
              <label for="fp-id">用户名或绑定邮箱</label>
              <input class="field" id="fp-id" maxlength="254" autocomplete="username" required>
            </div>
            <button type="button" class="btn" id="fp-send">发送验证码</button>
            <div class="form-row mt8">
              <label for="fp-code">验证码</label>
              <input class="field" id="fp-code" inputmode="numeric" maxlength="6" placeholder="6 位数字" required>
            </div>
            <div class="form-row">
              <label for="fp-password">新密码</label>
              <input class="field" id="fp-password" type="password" maxlength="72" autocomplete="new-password" required>
            </div>
            <div class="form-row">
              <label for="fp-password2">确认新密码</label>
              <input class="field" id="fp-password2" type="password" maxlength="72" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn primary" style="width:100%">重置密码</button>
          </form>

          <form id="register-form" class="hidden">
            <div class="form-row">
              <label for="r-username">用户名 <span class="hint">2-20 位，字母/数字/下划线</span></label>
              <input class="field" type="text" id="r-username" maxlength="20" autocomplete="username" required>
            </div>
            <div class="form-row">
              <label for="r-name">显示名称 <span class="hint">评论时展示的名字，1-30 位</span></label>
              <input class="field" type="text" id="r-name" maxlength="30" required>
            </div>
            <div class="form-row">
              <label for="r-email">邮箱 <span class="hint">用于验证账号和找回密码</span></label>
              <input class="field" type="email" id="r-email" maxlength="254" autocomplete="email" required>
            </div>
            <div class="form-row">
              <label for="r-password">密码 <span class="hint">6-72 位</span></label>
              <input class="field" type="password" id="r-password" maxlength="72" autocomplete="new-password" required>
            </div>
            <div class="form-row">
              <label for="r-password2">确认密码</label>
              <input class="field" type="password" id="r-password2" maxlength="72" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn primary" style="width:100%">注册并登录</button>
          </form>

          <form id="verify-form" class="hidden">
            <p class="muted mb8">验证码已发送到 <strong id="verify-email"></strong>，填下面完成注册。</p>
            <div id="verify-alert"></div>
            <div class="form-row">
              <label for="v-code">邮箱验证码</label>
              <input class="field" id="v-code" inputmode="numeric" maxlength="6" placeholder="6 位数字" required>
            </div>
            <button type="submit" class="btn primary" style="width:100%">验证并完成注册</button>
            <div class="mt8"><button type="button" class="btn" id="v-resend">重新发送验证码</button></div>
            <div class="login-switch"><a id="verify-goto-login">返回登录</a></div>
          </form>

          <div class="login-switch hidden" id="register-switch"><a id="goto-login">已有账号？去登录</a></div>
        </div>
      </div>
      <p class="muted px12" style="text-align:center">登录后才能使用 AI 机器人；每个账号每天有一定轮数，管理员不限。</p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/os.js"></script>
  <script src="js/login.js"></script>

  <!-- AI 机器人 -->
  <button class="chat-fab" id="chat-fab" title="和机器人聊聊"><img class="win98-svg-icon" src="assets/win98-icons/robot.png" alt=""> 找机器人</button>
  <div class="chat-window win" id="chat-window">
    <div class="win-title"><span class="win-label"><img class="win98-svg-icon" src="assets/win98-icons/robot.png" alt=""> 机器人</span><button class="chat-close" id="chat-close" title="关闭">✕</button></div>
    <div class="chat-body" id="chat-msgs">
      <div class="chat-msg bot"><div class="chat-nick"><img class="win98-svg-icon" src="assets/win98-icons/robot.png" alt=""> 机器人</div><div class="chat-text">你好呀，我是小戡的博客机器人，随便聊！</div></div>
    </div>
    <div class="chat-typing" id="chat-typing" style="display:none">机器人正在思考…</div>
    <div class="chat-input-row">
      <input class="field" id="chat-input" type="text" maxlength="500" placeholder="说点什么…">
      <button class="btn primary" id="chat-send">发送</button>
    </div>
  </div>
  <script src="js/chat.js"></script>
</body>
</html>
