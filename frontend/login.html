<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 小戡的博客</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta name="description" content="????? - ?? / ???">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-switch { text-align:center; margin-top:12px; font-size:13px; }
    .login-switch a { color:#0000ff; cursor:pointer; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-brand"><a href="index.html"><span class="brand-icon">戡</span>小戡的博客 · 账号</a></div>
    <div class="nav-links"><a href="index.html">返回首页</a></div>
  </nav>

  <main>
    <section class="section" style="max-width:420px">
      <div class="win" style="margin:40px auto">
        <div class="win-title"><span class="win-label">👤 登录 / 注册</span><span class="win-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>
        <div class="win-body">
          <div id="login-alert"></div>

          <form id="login-form">
            <div class="form-row">
              <label for="username">用户名</label>
              <input class="field" type="text" id="username" maxlength="20" autocomplete="username" required>
              <p class="hint">注册新账号请切换到下面的“注册”。管理员请用用户名 admin 登录。</p>
            </div>
            <div class="form-row">
              <label for="password">密码</label>
              <input class="field" type="password" id="password" maxlength="72" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn primary" style="width:100%">登录</button>
          </form>

          <div class="login-switch">没有账号？<a id="goto-register">注册一个</a> · <a id="forgot-pw">忘记密码？</a></div>

          <form id="forgot-form" class="hidden" style="margin-top:12px;padding:10px;border:2px inset;border-color:#808080 #fff #fff #808080;background:#fff">
            <p class="muted mb8">邮箱验证重置密码。只有已绑定邮箱的账号会收到验证码。</p>
            <div class="form-row">
              <label for="fp-id">用户名或绑定邮箱</label>
              <input class="field" id="fp-id" maxlength="254" autocomplete="username" required>
            </div>
            <button type="button" class="btn" id="fp-send">发送验证码</button>
            <div class="form-row mt8">
              <label for="fp-code">验证码</label>
              <input class="field" id="fp-code" inputmode="numeric" maxlength="6" placeholder="6 位数字" required>
            </div>
            <div class="form-row">
              <label for="fp-password">新密码</label>
              <input class="field" id="fp-password" type="password" maxlength="72" autocomplete="new-password" required>
            </div>
            <div class="form-row">
              <label for="fp-password2">确认新密码</label>
              <input class="field" id="fp-password2" type="password" maxlength="72" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn primary" style="width:100%">重置密码</button>
          </form>

          <form id="register-form" class="hidden">
            <div class="form-row">
              <label for="r-username">用户名 <span class="hint">2-20 位，字母/数字/下划线</span></label>
              <input class="field" type="text" id="r-username" maxlength="20" autocomplete="username" required>
            </div>
            <div class="form-row">
              <label for="r-name">显示名称 <span class="hint">评论时展示的名字，1-30 位</span></label>
              <input class="field" type="text" id="r-name" maxlength="30" required>
            </div>
            <div class="form-row">
              <label for="r-password">密码 <span class="hint">6-72 位</span></label>
              <input class="field" type="password" id="r-password" maxlength="72" autocomplete="new-password" required>
            </div>
            <div class="form-row">
              <label for="r-password2">确认密码</label>
              <input class="field" type="password" id="r-password2" maxlength="72" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn primary" style="width:100%">注册并登录</button>
          </form>

          <div class="login-switch hidden" id="register-switch"><a id="goto-login">已有账号？去登录</a></div>
        </div>
      </div>
      <p class="muted px12" style="text-align:center">登录后才能使用 AI 机器人；每个账号每天有一定轮数，管理员不限。</p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var next = new URLSearchParams(location.search).get("next") || "index.html";

    function show(msg, type) {
      $("login-alert").innerHTML = '<div class="alert ' + (type || "error") + '">' + Blog.escapeHtml(msg) + "</div>";
    }
    function setMode(register) {
      $("login-form").classList.toggle("hidden", register);
      $("register-form").classList.toggle("hidden", !register);
      $("goto-register").parentElement.classList.toggle("hidden", register);
      $("register-switch").classList.toggle("hidden", !register);
    }
    function finish(data) {
      Blog.setToken(data.token);
      Blog.setUser(data.username, data.role, data.display_name);
      location.href = next;
    }

    $("goto-register").addEventListener("click", function () { setMode(true); });
    $("forgot-pw").addEventListener("click", function () {
      var form = $("forgot-form");
      var show = form.classList.contains("hidden");
      form.classList.toggle("hidden", !show);
      $("login-form").classList.toggle("hidden", show);
      $("register-form").classList.add("hidden");
      $("goto-register").parentElement.classList.toggle("hidden", show);
      $("register-switch").classList.add("hidden");
    });
    $("goto-login").addEventListener("click", function () { setMode(false); });

    $("fp-send").addEventListener("click", function () {
      var identifier = $("fp-id").value.trim();
      if (!identifier) { show("先填用户名或邮箱"); return; }
      this.disabled = true;
      Blog.api("/api/auth/password-reset/code", { method: "POST", body: { identifier: identifier } })
        .then(function () { show("如果该账号已绑定邮箱，验证码会进入发信队列，稍等查收。", "ok"); })
        .catch(function (err) { show(err.message || "发送失败"); })
        .finally(function () { $("fp-send").disabled = false; });
    });

    $("forgot-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var identifier = $("fp-id").value.trim();
      var code = $("fp-code").value.trim();
      var p = $("fp-password").value;
      if (!identifier || !code || !p) { show("信息没填全"); return; }
      if (p !== $("fp-password2").value) { show("两次密码不一致"); return; }
      var btn = this.querySelector("button[type='submit']");
      btn.disabled = true;
      Blog.api("/api/auth/password-reset/confirm", { method: "POST", body: { identifier: identifier, code: code, new_password: p } })
        .then(function () {
          show("密码已重置，可以登录了。", "ok");
          setMode(false);
          $("password").focus();
        })
        .catch(function (err) { show(err.message || "重置失败"); })
        .finally(function () { btn.disabled = false; });
    });

    $("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var btn = this.querySelector("button");
      btn.disabled = true;
      Blog.api("/api/login", { method: "POST", body: { username: $("username").value.trim(), password: $("password").value } })
        .then(finish)
        .catch(function (err) { show(err.message || "登录失败"); })
        .finally(function () { btn.disabled = false; });
    });

    $("register-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var u = $("r-username").value.trim();
      var p = $("r-password").value;
      var n = $("r-name").value.trim();
      if (p !== $("r-password2").value) { show("两次密码不一致"); return; }
      if (!n) { show("请填写显示名称"); return; }
      var btn = this.querySelector("button");
      btn.disabled = true;
      Blog.api("/api/register", { method: "POST", body: { username: u, password: p, display_name: n } })
        .then(finish)
        .catch(function (err) { show(err.message || "注册失败"); })
        .finally(function () { btn.disabled = false; });
    });
  })();
  </script>
</body>
</html>
