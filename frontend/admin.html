<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 小戡的博客</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="lib/quill.snow.css">
  <style>
    #e-quill { border: 2px inset; border-color: #808080 #fff #fff #808080; background: #fff; }
    #e-quill .ql-editor { min-height: 240px; font-family: inherit; font-size: 14px; }
    .ql-toolbar.ql-snow { border: 2px solid !important; border-color: #fff #808080 #808080 #fff !important; background: #c0c0c0; }
    .ql-container.ql-snow { border: none !important; }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-brand"><a href="index.html"><span class="brand-icon">戡</span>小戡的博客 · 管理后台</a></div>
    <div class="nav-links" id="admin-nav-extra"></div>
  </nav>

  <main>
    <section class="section" style="max-width:860px">
      <!-- 登录窗 -->
      <div id="login-view" class="win" style="max-width:400px;margin:40px auto">
        <div class="win-title"><span class="win-label">🔒 管理员登录</span><span class="win-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>
        <div class="win-body">
          <div id="login-alert"></div>
          <form id="login-form">
            <div class="form-row">
              <label for="username">用户名</label>
              <input class="field" type="text" id="username" value="admin" autocomplete="username" required>
            </div>
            <div class="form-row">
              <label for="password">密码</label>
              <input class="field" type="password" id="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn primary">登 录</button>
          </form>
        </div>
      </div>

      <!-- 管理面板 -->
      <div id="panel-view" class="hidden">
        <div class="mb16" style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn primary" data-tab="articles">文章管理</button>
          <button class="btn" data-tab="messages">留言管理</button>
          <button class="btn" data-tab="comments">评论管理</button>
          <button class="btn" data-tab="users">👥 用户管理</button>
          <button class="btn" data-tab="bot">🤖 机器人设置</button>
          <button class="btn" data-tab="editor" id="new-article-btn">＋ 写新文章</button>
          <button class="btn danger" id="logout-btn">退出登录</button>
        </div>

        <div id="tab-articles" class="tab-pane">
          <div class="win flat mb16" id="articles-manage"><p class="muted px12">加载中…</p></div>
        </div>

        <div id="tab-messages" class="tab-pane hidden">
          <div class="win flat mb16" id="messages-manage"><p class="muted px12">加载中…</p></div>
        </div>

        <div id="tab-comments" class="tab-pane hidden">
          <div class="win flat mb16" id="comments-manage"><p class="muted px12">加载中…</p></div>
        </div>

        <div id="tab-users" class="tab-pane hidden">
          <div class="win flat mb16" id="users-manage"><p class="muted px12">加载中…</p></div>
        </div>

        <div id="tab-bot" class="tab-pane hidden">
          <div class="win">
            <div class="win-title"><span class="win-label">🤖 机器人设置</span><span class="win-dots"><span class="dot"></span></span></div>
            <div class="win-body">
              <div id="bot-alert"></div>
              <form id="bot-form">
                <div class="form-row">
                  <label for="bot-limit">每账号每日对话上限（轮） <span class="hint">管理员不受限</span></label>
                  <input class="field" type="number" id="bot-limit" min="1" max="100000" required>
                  <p class="hint">默认 20 轮，只限普通账号；管理员无限使用。调大 = 放开限制。</p>
                </div>
                <div class="form-row">
                  <label for="reg-limit">每 IP 每日注册上限（个）</label>
                  <input class="field" type="number" id="reg-limit" min="1" max="1000" required>
                  <p class="hint">默认 3 个，防刷号。</p>
                </div>
                <button type="submit" class="btn primary">保存设置</button>
              </form>
            </div>
          </div>
        </div>

        <div id="tab-editor" class="tab-pane hidden">
          <div class="win">
            <div class="win-title"><span class="win-label" id="editor-title">写新文章</span><span class="win-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>
            <div class="win-body">
              <div id="editor-alert"></div>
              <form id="editor-form">
                <div class="form-row">
                  <label for="e-title">标题 *</label>
                  <input class="field" type="text" id="e-title" maxlength="200" required>
                </div>
                <div class="form-row">
                  <label for="e-slug">链接标识（slug）* <span class="hint">只能含字母/数字/中划线/下划线，如 my-first-post；留空自动生成</span></label>
                  <input class="field" type="text" id="e-slug" maxlength="120" placeholder="留空自动生成">
                </div>
                <div class="form-row">
                  <label>正文 * <span class="hint">富文本 / Markdown 两种模式，存库统一是 Markdown</span></label>
                  <div class="mb8" style="display:flex;gap:8px">
                    <button type="button" class="btn primary" id="mode-rich">✍️ 富文本</button>
                    <button type="button" class="btn" id="mode-md"># Markdown</button>
                  </div>
                  <div id="e-quill-wrap"><div id="e-quill"></div></div>
                  <textarea class="field hidden" id="e-content" style="min-height:260px"></textarea>
                </div>
                <div class="mb16">
                  <button type="button" class="btn" id="preview-toggle">预览</button>
                </div>
                <div id="e-preview" class="hidden markdown-body win flat mb16"></div>
                <div style="display:flex;gap:8px">
                  <button type="submit" class="btn primary">保 存</button>
                  <button type="button" class="btn" id="editor-cancel">取 消</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-row">
      <span>管理后台 · <a href="index.html">← 返回首页</a></span>
      <span>Vibe Coding 产物 · <a class="admin-link" href="index.html">小戡的博客</a></span>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="lib/marked.min.js"></script>
  <script src="lib/quill.js"></script>
  <script src="lib/turndown.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
