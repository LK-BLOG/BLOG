<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章 - 小戡的博客</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-brand"><a href="index.html"><span class="brand-icon">戡</span>小戡的博客</a></div>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label" aria-label="菜单"><span></span><span></span><span></span></label>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="articles.html">文章</a>
      <a href="guestbook.html">留言板</a>
      <a href="about.html">关于</a>
      <a href="friends.html">友链</a>
    </div>
  </nav>
  <main>
    <section class="section">
      <p class="mb8"><a href="articles.html">← 返回文章列表</a></p>
      <div id="post" class="win"><div class="win-body"><p class="muted">加载中…</p></div></div>
      <div id="comments" class="win mt16 hidden">
        <div class="win-title"><span class="win-label">💬 评论区</span><span class="win-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>
        <div class="win-body">
          <div id="cmt-alert"></div>
          <div id="cmt-auth" class="mb16"></div>
          <form id="cmt-form" class="mb16 hidden">
            <div class="form-row">
              <label for="cmt-content">内容 <span class="hint" id="cmt-replyto"></span></label>
              <textarea class="field" id="cmt-content" maxlength="500" placeholder="说点什么…最多 500 字；以 @Bot 开头可以召唤机器人" required></textarea>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button type="button" class="btn" id="cmt-atbot">@Bot 召唤机器人</button>
              <button type="submit" class="btn primary">发表评论</button>
              <button type="button" class="btn hidden" id="cmt-cancel-reply">取消回复</button>
            </div>
          </form>
          <div id="cmt-list"></div>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer">
    <marquee class="ticker" scrollamount="6">🎉 欢迎来到小戡的博客！本站 90 年代风格，Vibe Coding 产物，后端跑在 Cloudflare 上。随便逛，留言板记得踩一脚！</marquee>
    <div class="footer-row">
      <span>© 2026 小戡的博客 · Vibe Coding 产物 · GitHub + Cloudflare</span>
      <span><a class="admin-link" href="admin.html">管理入口</a></span>
    </div>
  </footer>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="lib/marked.min.js"></script>
  <script src="js/article.js"></script>
  <!-- AI 机器人 -->
  <button class="chat-fab" id="chat-fab" title="和机器人聊聊">🤖 找机器人</button>
  <div class="chat-window win" id="chat-window">
    <div class="win-title"><span class="win-label">🤖 机器人</span><button class="chat-close" id="chat-close" title="关闭">✕</button></div>
    <div class="chat-body" id="chat-msgs">
      <div class="chat-msg bot"><div class="chat-nick">🤖 机器人</div><div class="chat-text">你好呀，我是小戡的博客机器人，随便聊！</div></div>
    </div>
    <div class="chat-typing" id="chat-typing" style="display:none">机器人正在思考…</div>
    <div class="chat-input-row">
      <input class="field" id="chat-input" type="text" maxlength="500" placeholder="说点什么…">
      <button class="btn primary" id="chat-send">发送</button>
    </div>
  </div>
  <script src="js/chat.js"></script>
</body>
</html>
